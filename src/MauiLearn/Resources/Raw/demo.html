<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>WebView local</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; padding: 16px; background: #F4F1FF; color: #222; }
  h1 { color: #512BD4; }
  button { background: #512BD4; color: white; border: 0; padding: 8px 16px; border-radius: 6px; }
</style>
</head>
<body>

  <button onclick="c++; document.getElementById('contador').innerText = 'Cliques: ' + c;">Clique</button>
  <script>var c = 0;</script>

</html>
